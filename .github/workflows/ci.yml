name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install PyQt5
      - name: Unit tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            url=$(curl -sf --data-binary @test_output.log https://paste.rs || true)
            if [ -z "$url" ]; then
              url=$(curl -sf -F "file=@test_output.log" https://0x0.st || true)
            fi
            if [ -n "$url" ]; then
              echo "::error::Test log ($RUNNER_OS): $url"
            fi
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### ❌ Unit tests failed on $RUNNER_OS"
                echo '```'
                tail -60 test_output.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$status"
      - name: Compile check
        run: python -m py_compile tray/adbtray.py

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck scripts/adbconnect.sh install.sh uninstall.sh
      - name: bash syntax (installers)
        run: bash -n install.sh uninstall.sh

  lint-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw scripts/adbconnect.ps1))
          Write-Host "adbconnect.ps1 parses OK"
          $null = [scriptblock]::Create((Get-Content -Raw install.ps1))
          Write-Host "install.ps1 parses OK"
