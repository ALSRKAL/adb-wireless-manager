name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test_output.log 2>&1
          status=$?
          cat test_output.log
          if [ "$status" -ne 0 ]; then
            url=$(curl -sf --data-binary @test_output.log https://paste.rs || true)
            if [ -n "$url" ]; then
              echo "::error::Test log ($RUNNER_OS): $url"
            fi
            tail -45 test_output.log | grep -v '^[[:space:]]*$' | tail -9 \
              | while IFS= read -r ln; do
                  echo "::error::$ln"
                done
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### Unit tests failed on $RUNNER_OS"
                echo '```'
                tail -60 test_output.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$status"
      - name: Compile check
        run: python -m py_compile tray/adbtray.py

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # keep this list in step with SHELL_FILES in tests/run_tests.sh, so a
      # local run cannot pass while CI fails
      - name: shellcheck
        run: |
          shellcheck scripts/adbconnect.sh install.sh uninstall.sh \
            tests/run_tests.sh
      - name: bash syntax
        run: |
          bash -n scripts/adbconnect.sh
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/run_tests.sh

  lint-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw scripts/adbconnect.ps1))
          Write-Host "adbconnect.ps1 parses OK"
          $null = [scriptblock]::Create((Get-Content -Raw install.ps1))
          Write-Host "install.ps1 parses OK"
